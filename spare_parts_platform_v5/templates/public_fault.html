<!doctype html><html lang="{{ 'en' if current_lang == 'en' else 'zh-CN' }}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>移动端故障提报</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body style="background:linear-gradient(150deg,#eff5ff,#f7f9fc);min-height:100vh;padding:22px"><div style="position:fixed;right:16px;top:14px;z-index:5" class="language-switch"><a class="{{ 'active' if current_lang == 'zh' }}" href="{{ url_for('set_language', lang='zh') }}">{{ 'ZH' if current_lang == 'en' else '中文' }}</a><a class="{{ 'active' if current_lang == 'en' }}" href="{{ url_for('set_language', lang='en') }}">EN</a></div>
<main style="max-width:620px;margin:auto"><div class="brand" style="color:var(--ink);padding-left:0"><div class="brand-mark">{{ 'F' if current_lang == 'en' else '备' }}</div><div><strong>设备故障移动提报</strong><small style="color:var(--muted)">扫码提交 · 自动生成待办</small></div></div>
{% if submitted %}<div class="card card-body" style="text-align:center;padding:42px 24px"><div style="font-size:44px;color:var(--success)">✓</div><h2>故障提报成功</h2><p>工单编号：<strong>{{ submitted.number }}</strong></p><p class="cell-sub">技术人员将尽快处理，请妥善保存工单编号。</p><a class="btn btn-primary" href="{{ url_for('public_fault', source=report_source) }}">继续提报</a></div>{% else %}<form class="card card-body form-grid" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="hidden" name="source" value="{{ report_source }}"><div class="field full"><div class="callout">故障发生后请准确选择设备，并简要描述现场现象。</div></div><div class="field full"><label class="required">故障设备</label><select name="equipment_id" required>{% for e in equipment %}<option value="{{ e.id }}">{{ e.full_name }}</option>{% endfor %}</select></div><div class="field"><label class="required">提报人</label><input name="reporter" required></div><div class="field"><label>联系方式</label><input name="contact" placeholder="手机或内线"></div><div class="field full"><label class="required">故障描述</label><textarea name="description" required placeholder="例如：开箱机三工位运行时出现异响并停机"></textarea></div><div class="form-footer"><button class="btn btn-primary" style="width:100%">{{ t('提交故障') }}</button></div></form>{% endif %}</main><script>window.PAGE_TRANSLATIONS = {{ translations|tojson }};</script><script src="{{ url_for('static', filename='app.js', v='5') }}"></script></body></html>
